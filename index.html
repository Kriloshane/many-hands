<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <!-- Grainy edge effect used by the links (see style.css) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Slowly flickering grain used by the title pictures -->
    <filter id="shimmer" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="1" result="noise">
        <animate attributeName="seed" values="1;2;3;4;5;6;7;8" dur="1.6s"
                 calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- One tall page (2 screens high) with the background behind everything -->
  <div class="page">

    <!-- Title picture, top of the page -->
    <picture>
      <source media="(min-width: 768px)" srcset="images/title-desktop.png">
      <img class="title" src="images/title-phone.png" alt="Archive title">
    </picture>

    <!-- Links, lower down on the same background -->
    <div class="menu">
      <ol class="links">
        <li><a href="page1.html">cobwebs and cocoons</a></li>
        <li><a href="page2.html">when the rain falls down, misty spirits upon the world</a></li>
        <li><a href="page3.html">Tree rings carved into quiet stone...</a></li>
        <li><a href="page4.html">We forget that we started with art</a></li>
        <li><a href="page5.html">Traces We Leave </a></li>
        <li><a href="page6.html">I once photographed a scene in Richmond Park...</a></li>
        <li><a href="page7.html">Baby</a></li>
        <li><a href="page8.html">Footprint</a></li>
      </ol>
      <p class="video-link"><a href="video.html">Video</a></p>
    </div>

  </div>
</body>
</html>
